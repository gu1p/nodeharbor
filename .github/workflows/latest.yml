name: Reconcile latest release
on:
  workflow_run:
    workflows: [Native release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reconcile-latest-release
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/release.py reconcile-latest

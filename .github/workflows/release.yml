name: Native release
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Build attempts are independent. A slow older main push cannot cancel a newer
# one, and no pending build is discarded by a shared concurrency group.
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: identity
        shell: bash
        run: |
          version=$(python scripts/release.py version)
          printf 'version=%s\ncommit=%s\n' "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  native:
    needs: identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
      BUILD_TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libxss-dev xvfb
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Stamp the release identity
        run: python scripts/release.py stamp "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - name: Required checks
        run: python scripts/check.py
      - name: Build native installers and worker tools
        run: python scripts/build.py "$BUILD_TARGET" "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  container-check:
    needs: [identity, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Build both controller images and run the container smoke test
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python scripts/container.py dist "$BUILD_VERSION" "$BUILD_COMMIT"

  container-publish:
    needs: [identity, native, container-check]
    if: github.event_name == 'push' && github.repository == 'gu1p/nodeharbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-${{ needs.identity.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish immutable images to Sikalio's registry
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_COMMIT: ${{ needs.identity.outputs.commit }}
          NODEHARBOR_REGISTRY_USERNAME: ${{ secrets.NODEHARBOR_REGISTRY_USERNAME }}
          NODEHARBOR_REGISTRY_PASSWORD: ${{ secrets.NODEHARBOR_REGISTRY_PASSWORD }}
        run: python scripts/container.py dist "$BUILD_VERSION" "$BUILD_COMMIT" --publish

  publish:
    needs: [identity, native, container-publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ needs.identity.outputs.commit }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify every target
        run: python scripts/release.py validate dist "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - name: Install signing tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and publish the complete release
        env:
          SIGNING_KEY: ${{ secrets.NODEHARBOR_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python scripts/release.py publish dist "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT" --key "$key"
      - name: Retain release verification records in CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification-${{ needs.identity.outputs.version }}
          path: |
            dist/*.json
            dist/SHA256SUMS*
            dist/*.minisig
            nodeharbor.minisign.pub
          if-no-files-found: error
          retention-days: 90

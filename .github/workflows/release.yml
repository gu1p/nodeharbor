name: Native release
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Build attempts are independent. A slow older main push cannot cancel a newer
# one, and no pending build is discarded by a shared concurrency group.
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: identity
        shell: bash
        run: |
          version=$(python scripts/release.py version)
          printf 'version=%s\ncommit=%s\n' "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  native:
    needs: identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
      BUILD_TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libxss-dev xvfb
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Stamp the release identity
        run: python scripts/release.py stamp "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - name: Required checks
        run: python scripts/check.py
      - name: Build native installers and worker tools
        run: python scripts/build.py "$BUILD_TARGET" "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android
      - name: Install the pinned Android build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build
          python -m venv .local/android-tools
          .local/android-tools/bin/pip install meson==1.9.1 ninja==1.13.0
          echo "$PWD/.local/android-tools/bin" >> "$GITHUB_PATH"
          python - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input='y\n'*100, text=True, check=True)
          subprocess.run([manager, 'platforms;android-37.0', 'build-tools;37.0.0', 'ndk;28.2.13676358', 'cmake;3.22.1'], check=True)
          PY
      - name: Build and verify the isolated runtime and corresponding sources
        run: python scripts/build_android_runtime.py --bundle-sources
      - name: Build the development APK and run Android checks
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: python scripts/build_android.py "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - name: Build the signed release APK and run Android checks
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NODEHARBOR_ANDROID_KEYSTORE_BASE64: ${{ secrets.NODEHARBOR_ANDROID_KEYSTORE_BASE64 }}
          NODEHARBOR_ANDROID_STORE_PASSWORD: ${{ secrets.NODEHARBOR_ANDROID_STORE_PASSWORD }}
          NODEHARBOR_ANDROID_KEY_ALIAS: ${{ secrets.NODEHARBOR_ANDROID_KEY_ALIAS }}
          NODEHARBOR_ANDROID_KEY_PASSWORD: ${{ secrets.NODEHARBOR_ANDROID_KEY_PASSWORD }}
        run: python scripts/build_android.py "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT" --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-aarch64-linux-android
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android-qualification:
    needs: [identity, android]
    # Dedicated hardware and fleet credentials never execute pull-request code.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, nodeharbor-android]
    timeout-minutes: 120
    concurrency:
      group: android-qualification-devices
      cancel-in-progress: false
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-aarch64-linux-android
          path: dist
      - name: Test the exact APK, owner controls, and a real qualified ARM64 job
        run: python scripts/qualify_android.py dist "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-qualification
          path: |
            dist/*-aarch64-linux-android.json
            dist/android-qualification.json
          if-no-files-found: error
          retention-days: 90

  container-check:
    needs: [identity, native, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Build both controller images and run the container smoke test
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python scripts/container.py dist "$BUILD_VERSION" "$BUILD_COMMIT"

  container-publish:
    needs: [identity, native, container-check]
    if: github.event_name == 'push' && github.repository == 'gu1p/nodeharbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-${{ needs.identity.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish immutable images to Sikalio's registry
        env:
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_COMMIT: ${{ needs.identity.outputs.commit }}
          NODEHARBOR_REGISTRY_USERNAME: ${{ secrets.NODEHARBOR_REGISTRY_USERNAME }}
          NODEHARBOR_REGISTRY_PASSWORD: ${{ secrets.NODEHARBOR_REGISTRY_PASSWORD }}
        run: python scripts/container.py dist "$BUILD_VERSION" "$BUILD_COMMIT" --publish

  publish:
    needs: [identity, native, container-publish, android-qualification]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ needs.identity.outputs.commit }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NODEHARBOR_VERSION: ${{ needs.identity.outputs.version }}
      NODEHARBOR_COMMIT: ${{ needs.identity.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-qualification
          path: dist
      - name: Verify every target
        run: python scripts/release.py validate dist "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT"
      - name: Install signing tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and publish the complete release
        env:
          SIGNING_KEY: ${{ secrets.NODEHARBOR_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python scripts/release.py publish dist "$NODEHARBOR_VERSION" "$NODEHARBOR_COMMIT" --key "$key"
      - name: Retain release verification records in CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification-${{ needs.identity.outputs.version }}
          path: |
            dist/*.json
            dist/SHA256SUMS*
            dist/*.minisig
            nodeharbor.minisign.pub
          if-no-files-found: error
          retention-days: 90
